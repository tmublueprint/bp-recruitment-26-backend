name: Test

on:
  pull_request_target:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install candidate dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch test suite
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.TEST_REPO_TOKEN }}@github.com/tmublueprint/bp-recruitment-test.git /tmp/tests
          cp /tmp/tests/test.py .
          rm -rf /tmp/tests
        env:
          TEST_REPO_TOKEN: ${{ secrets.TEST_REPO_TOKEN }}

      - name: Install test dependencies
        run: pip install requests

      - name: Start server
        run: python app.py &
        env:
          PORT: 3000

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -s http://localhost:3000/orders > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run tests
        id: tests
        run: |
          python test.py 2>&1 | tee /tmp/test_output.txt
          exit ${PIPESTATUS[0]}

      - name: Report score
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/test_output.txt', 'utf8');

            // Try to extract a score pattern like "X/Y" or "X passed" or "Score: X"
            const scoreMatch = output.match(/(\d+)\s*\/\s*(\d+)|(\d+)\s+passed|Score[:\s]*(\d+%?)/i);
            const score = scoreMatch ? scoreMatch[0] : 'see details';
            const failed = /FAIL|✗|failed|ERROR|Traceback/i.test(output);
            const conclusion = failed ? 'failure' : 'success';

            const sha = context.payload.pull_request.head.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '🧪 Test Score',
              head_sha: sha,
              status: 'completed',
              conclusion,
              output: {
                title: `Score: ${score}`,
                summary: '```\n' + output.slice(-2000) + '\n```',
                text: output
              }
            });

      - name: Display score in job summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
